# User-selected provisional scale, not a calibrated physical measurement.
# base_link follows the big gimbal; embedded firmware handles gimbal-to-chassis rotation.
/**:
  ros__parameters:
    speed_at_full_scale_mps: 1.0
bit_can_bridge:
  ros__parameters:
    interface: can0
    send_frequency_hz: 500.0
    cmd_vel_timeout_s: 0.1
